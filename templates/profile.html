{% extends "base.html" %}{% block content %}
<div class="card"><h2>{{ user.full_name }}</h2><p><strong>Username:</strong> {{ user.username }}</p><p><strong>Email:</strong> {{ user.email }}</p><p><strong>Role:</strong> {{ user.role }}</p></div>
<div class="card"><h3>Notes</h3>{% for note in notes %}<article class="note"><h4>{{ note.title }}</h4><p>{{ note.body }}</p></article>{% else %}<p class="muted">No notes.</p>{% endfor %}</div>
{% endblock %}
